name: Sync main and master

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-main-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fast-forward both branch names
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/heads/master:refs/remotes/origin/master
          main_commit=$(git rev-parse origin/main)
          master_commit=$(git rev-parse origin/master)

          if [ "$main_commit" = "$master_commit" ]; then
            echo "main and master already match at $main_commit"
            exit 0
          elif git merge-base --is-ancestor "$main_commit" "$master_commit"; then
            newest_commit=$master_commit
          elif git merge-base --is-ancestor "$master_commit" "$main_commit"; then
            newest_commit=$main_commit
          else
            echo "::error::main and master diverged. Merge their work before synchronizing."
            exit 1
          fi

          # Both updates must fast-forward, even if another push races this job.
          git push --atomic origin \
            "$newest_commit:refs/heads/main" \
            "$newest_commit:refs/heads/master"
